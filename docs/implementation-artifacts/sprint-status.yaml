    acceptance_criteria_count: 9
    description: |
      Command: agentvibes config music
      Menu options: Change, Remove, Reset to default.
      Display current setting, changes take effect immediately.
      Backup of previous setting maintained.
    dependencies:
      - AVI-S4.5

  story_4_7:
    id: AVI-S4.7
    title: TTS Integration - Background Music Mixing
    status: ready-for-dev
    story_points: 3
    acceptance_criteria_count: 10
    description: |
      Integrate custom music with TTS voice output.
      Load from .claude/audio/custom-music/, graceful fallback to default.
      Works with all TTS providers and personality types.
      Loop if shorter than TTS output, no audio artifacts.
    dependencies:
      - AVI-S4.4

