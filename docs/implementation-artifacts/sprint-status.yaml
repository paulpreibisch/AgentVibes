    description: |
      Interactive prompt during installer for audio file path.
      Support absolute/relative paths, tab-completion, validation feedback.
      Progress indicator while validating, retry logic (max 3 attempts).
    dependencies:
      - AVI-S4.1
      - AVI-S4.2
      - AVI-S4.3
      - AVI-S4.4

