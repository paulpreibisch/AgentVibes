  story_4_1:
    id: AVI-S4.1
    title: Path Validation and Security Hardening
    status: complete
    story_points: 4
    acceptance_criteria_count: 10
    description: |
      Validate file paths securely to prevent path traversal attacks.
      Use path.resolve() for all operations, verify paths within home directory,
      reject symlinks/relative paths, verify file ownership.
    completion_date: 2026-02-14
    notes: Security-critical foundation for custom music feature

  story_4_2:
    id: AVI-S4.2
    title: Audio Format Detection (Magic Number Validation)
    status: complete
    story_points: 3
    acceptance_criteria_count: 10
    description: |
      Validate audio file format by checking file headers (magic numbers).
      Support .mp3, .wav, .ogg, .m4a. Verify extension matches actual content.
      Reject unsupported formats with clear error messages.
    completion_date: 2026-02-14
    notes: Validates file integrity and format compliance

  story_4_3:
    id: AVI-S4.3
    title: File Ownership Verification
    status: complete
    story_points: 2
    acceptance_criteria_count: 7
    description: |
      Verify file ownership before processing.
      Check UID matches current user, cross-platform compatible.
      Reject files not owned by current user (security check).
    completion_date: 2026-02-14
    notes: Prevents malicious files planted by other users

  story_4_4:
    id: AVI-S4.4
    title: File Copy and Secure Storage
    status: complete
    story_points: 3
    acceptance_criteria_count: 11
    description: |
      Copy validated music files to secure storage at .claude/audio/custom-music/.
      Directory permissions 700, file permissions 600.
      Verify integrity with checksums, backup previous music, atomic operations.
    completion_date: 2026-02-14
    notes: Implements secure storage with backup and integrity verification

  # READY FOR DEVELOPMENT STORIES
  story_4_5:
