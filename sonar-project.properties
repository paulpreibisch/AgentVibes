sonar.projectKey=paulpreibisch_AgentVibes
sonar.organization=paulpreibisch

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=AgentVibes
sonar.projectVersion=5.10.1

# Quality Gate Configuration:
# The default 80% "Coverage on New Code" threshold may fail for commits that
# primarily add tests/config (which can't have coverage). See .sonarcloud-quality-gate.md
# for recommended threshold adjustments in the SonarCloud dashboard.

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# Only analyze JavaScript/Python files, not bash scripts
sonar.sources=src,mcp-server
sonar.tests=test

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclusions for source and coverage
# Exclude test files, config files, and media from source code analysis
sonar.exclusions=test/**,**/*.test.js,**/*.bats,**/test_*.py,**/conftest.py,**/node_modules/**,**/*.json,**/*.md,**/*.wav,**/*.mp3
sonar.test.inclusions=**/*.test.js,**/*.bats,**/test_*.py

# JavaScript/TypeScript specific properties
sonar.javascript.node.maxspace=4096

# Coverage exclusions (files not to include in coverage analysis)
# Most of this project is bash scripts which don't have coverage tooling.
# install-mcp.js is an interactive system installer (brew/apt/pipx) whose
# code paths cannot be exercised in unit tests without running real package managers.
sonar.coverage.exclusions=test/**,bin/**,.claude/hooks/**,**/*.sh,**/*.bash,src/commands/install-mcp.js

# JavaScript coverage from c8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusions
sonar.cpd.exclusions=**/*.json,**/*.md
