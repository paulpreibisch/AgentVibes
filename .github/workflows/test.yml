name: Test Suite

on:
  # Nightly run on master catches breakage from new runner images or dependencies.
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Install BATS and Bash 4+
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y bats sox ffmpeg
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # Install bash 5.x (required for associative arrays in tests)
            brew install bash bats-core sox ffmpeg
            # Add to PATH
            echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python test deps
        # mcp-server/requirements.txt is REQUIRED, not optional: test_mcp_correctness.py
        # does `from server import ...`, and server.py imports mcp (which pulls idna).
        # Installing only pytest made every run fail at collection with
        # "ModuleNotFoundError: No module named 'idna'".
        run: python -m pip install --upgrade pip pytest -r mcp-server/requirements.txt

      - name: Setup test fixtures
        run: cp .claude/config/audio-effects.cfg.sample .claude/config/audio-effects.cfg

      - name: Run MCP server tests (pytest)
        # AVI-S8.7: the 1,800-line MCP server was never exercised in CI. This runs
        # the exit-code/timeout/replay/personality regression suite (test_mcp_correctness)
        # and the Windows<->bash script parity test on every push/PR.
        run: python -m pytest mcp-server/ -q

      - name: Run tests
        env:
          ELEVENLABS_API_KEY: test_mock_key
          # Note: AGENTVIBES_TEST_MODE is NOT set here intentionally.
          # The bats tests set it themselves (AGENTVIBES_TEST_MODE=true bats ...).
          # Node.js unit tests use mock.module for isolation and must not have
          # AGENTVIBES_TEST_MODE set, otherwise IS_TEST stubs bypass real code paths.
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Ensure BATS uses bash 5.x for associative array support
            export PATH="$(brew --prefix)/bin:$PATH"
            echo "Using Bash version: $(bash --version | head -n 1)"
          fi
          npm test

      - name: Report test results
        if: always()
        run: |
          echo "✅ Test suite completed on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
          echo "See test results above"
