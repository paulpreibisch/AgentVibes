name: macOS Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Allow manual trigger

# Note: Using macos-14 (M1), macos-15 (latest M-series)
# macOS-13 was retired by GitHub Actions in December 2024
# macos-15-large (Intel) removed due to GitHub Actions billing limits

jobs:
  test-macos:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]  # M1 (14), latest M-series (15)
        node-version: ['20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: System information
        run: |
          echo "=== System Info ==="
          sw_vers
          echo ""
          echo "=== Architecture ==="
          uname -m
          echo ""
          echo "=== Node version ==="
          node --version
          echo ""
          echo "=== npm version ==="
          npm --version
          echo ""
          echo "=== Shell ==="
          echo $SHELL
          echo ""
          echo "=== Audio devices ==="
          system_profiler SPAudioDataType || echo "Could not get audio info"

      - name: Install dependencies
        run: npm install

      - name: Install BATS and Bash 5.x
        run: |
          # Install bash 5.x (macOS ships with bash 3.2 which doesn't support associative arrays)
          brew install bash bats-core
          echo "Installed Bash version:"
          $(brew --prefix)/bin/bash --version | head -n 1

      - name: Check for ffmpeg (needed for Piper audio)
        run: |
          if command -v ffmpeg &> /dev/null; then
            echo "✅ ffmpeg found: $(which ffmpeg)"
            ffmpeg -version | head -n 1
          else
            echo "⚠️  ffmpeg not found - installing"
            brew install ffmpeg
          fi

      - name: Check for sox (needed for background music and audio effects)
        run: |
          if command -v sox &> /dev/null; then
            echo "✅ sox found: $(which sox)"
            sox --version
          else
            echo "⚠️  sox not found - installing"
            brew install sox
          fi

      - name: Check for audio playback tools
        run: |
          echo "=== Checking audio tools ==="
          if command -v afplay &> /dev/null; then
            echo "✅ afplay found (native macOS audio player)"
          fi
          if command -v ffplay &> /dev/null; then
            echo "✅ ffplay found"
          fi
          if command -v mpv &> /dev/null; then
            echo "✅ mpv found"
          else
            echo "⚠️  mpv not found - installing"
            brew install mpv
          fi

      - name: Run unit tests
        env:
          ELEVENLABS_API_KEY: test_mock_key
          # Note: AGENTVIBES_TEST_MODE is NOT set here intentionally.
          # The bats tests set it themselves (AGENTVIBES_TEST_MODE=true bats ...).
          # Node.js unit tests use mock.module for isolation and must not have
          # AGENTVIBES_TEST_MODE set, otherwise IS_TEST stubs bypass real code paths.
        run: |
          # Ensure we're using bash 5.x for associative array support in tests
          export PATH="$(brew --prefix)/bin:$PATH"
          echo "Using Bash version: $(bash --version | head -n 1)"
          which bash
          npm test

      - name: Test installation process
        run: |
          echo "=== Testing AgentVibes installation ==="
          # Create a temporary directory for testing
          TEST_DIR="$HOME/agentvibes-test"
          mkdir -p "$TEST_DIR"
          cd "$TEST_DIR"

          # Initialize a test .claude directory
          mkdir -p .claude/hooks
          mkdir -p .claude/commands

          # Test the installer (dry run mode)
          echo "Testing installer..."
          node $GITHUB_WORKSPACE/src/installer.js --help || true

      - name: Test Piper TTS installation on macOS
        # Runs the shipped installer the way a fresh Mac sees it: an empty home,
        # the system python3 and no pipx or Homebrew on PATH. Then speaks with it.
        run: |
          export HOME="$RUNNER_TEMP/fresh-home"
          mkdir -p "$HOME"
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"

          bash .claude/hooks/piper-installer.sh --non-interactive

          PIPER="$HOME/.local/bin/piper"
          VOICE="$HOME/.claude/piper-voices/en_US-ryan-high.onnx"
          test -x "$PIPER"
          test -f "$VOICE"
          echo "Hello from AgentVibes on macOS" | "$PIPER" --model "$VOICE" --output_file "$RUNNER_TEMP/piper-test.wav"
          test -s "$RUNNER_TEMP/piper-test.wav"
          echo "✅ Piper installed and synthesized $(wc -c < "$RUNNER_TEMP/piper-test.wav") bytes of audio"

          # A second run must see the working install and leave it alone.
          bash .claude/hooks/piper-installer.sh --non-interactive | grep -q "already installed"

      - name: Test ElevenLabs API integration (mock)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY_TEST }}
        run: |
          echo "=== Testing ElevenLabs integration ==="
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "⚠️  No test API key configured (this is fine for PR tests)"
            echo "Using mock mode"
          else
            echo "✅ API key configured - testing real API"
            # Test actual API call if key is present
            curl -s -X POST \
              "https://api.elevenlabs.io/v1/text-to-speech/21m00Tcm4TlvDq8ikWAM" \
              -H "xi-api-key: $ELEVENLABS_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"text":"Testing from macOS GitHub Actions","model_id":"eleven_monolingual_v1"}' \
              --output /tmp/test-audio.mp3 \
              && echo "✅ API call successful" \
              || echo "⚠️  API call failed (may be rate limited or invalid key)"
          fi

      - name: Test audio file generation
        run: |
          echo "=== Testing audio generation ==="
          # Create a simple test to generate an audio file
          TEST_AUDIO_DIR="$HOME/.claude/audio"
          mkdir -p "$TEST_AUDIO_DIR"

          # Test ffmpeg can create audio
          if command -v ffmpeg &> /dev/null; then
            ffmpeg -f lavfi -i "sine=frequency=1000:duration=1" -c:a libmp3lame "$TEST_AUDIO_DIR/test-tone.mp3" -y 2>&1 | head -n 5

            if [ -f "$TEST_AUDIO_DIR/test-tone.mp3" ]; then
              ls -lh "$TEST_AUDIO_DIR/test-tone.mp3"
              echo "✅ Audio file generated successfully"
            else
              echo "❌ Failed to generate audio file"
              exit 1
            fi
          fi

      - name: Test Python MCP dependencies
        run: |
          echo "=== Testing Python/MCP setup ==="
          # Check Python version
          if command -v python3 &> /dev/null; then
            echo "✅ Python3 found: $(python3 --version)"

            # Check if pip is available
            if command -v pip3 &> /dev/null; then
              echo "✅ pip3 found: $(pip3 --version)"

              # Test MCP package installation (in a virtual env)
              echo "Creating virtual environment for MCP test..."
              python3 -m venv /tmp/test-mcp-env
              source /tmp/test-mcp-env/bin/activate

              echo "Installing MCP package..."
              if pip install "mcp>=1.27,<2" 2>&1; then
                echo "✅ MCP package installation completed"

                # Verify import
                if python3 -c "import mcp" 2>/dev/null; then
                  echo "✅ MCP package imported successfully"
                else
                  echo "⚠️  MCP installed but import failed (non-critical for tests)"
                fi
              else
                echo "⚠️  MCP package installation failed (non-critical for tests)"
                echo "This is expected on macOS due to PEP 668 - virtual environments work fine"
              fi

              deactivate
            else
              echo "⚠️  pip3 not found (non-critical)"
            fi
          else
            echo "⚠️  Python3 not found (non-critical)"
          fi

          # Always succeed - MCP is optional for unit tests
          exit 0

      - name: Report test results
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║           macOS Test Suite - Summary                       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "✅ Test suite completed on ${{ matrix.os }}"
          echo "   Node version: ${{ matrix.node-version }}"
          echo "   Architecture: $(uname -m)"
          echo ""
          echo "See detailed test results above"
          echo ""

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            ~/.claude/audio/
            /tmp/test-*.log
          retention-days: 7
