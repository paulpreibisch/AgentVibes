name: Windows Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Windows / Node ${{ matrix.node-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    # Use Git bash for all steps so globs expand and Unix commands work
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: System information
        run: |
          echo "=== Node ==="
          node --version
          echo "=== npm ==="
          npm --version
          echo "=== Bash ==="
          bash --version | head -1
          echo "=== PowerShell ==="
          powershell -NoProfile -Command 'Write-Host $PSVersionTable.PSVersion.ToString()'
          echo "=== ffmpeg (pre-installed) ==="
          ffmpeg -version 2>&1 | head -1 || echo "ffmpeg not found"

      - name: Install Node.js dependencies
        run: npm ci

      # Fix #1: Add sox to GITHUB_PATH so all subsequent steps see it without manual PATH hacks
      - name: Install sox via Chocolatey
        shell: powershell
        run: |
          choco install sox.portable -y --no-progress
          # Propagate sox location to subsequent steps via GITHUB_PATH
          $soxDir = "C:\ProgramData\chocolatey\bin"
          if (Test-Path "$soxDir\sox.exe") {
            Write-Host "Adding $soxDir to GITHUB_PATH"
            "$soxDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            # Fallback: search choco lib for sox tools directory
            $soxExe = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter "sox.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($soxExe) {
              $soxExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Found sox at $($soxExe.FullName)"
            } else {
              Write-Warning "sox.exe not found after choco install"
            }
          }

      - name: Install BATS
        run: npm install -g bats

      # ─── JavaScript / Node.js tests ──────────────────────────────────────

      - name: Setup test fixtures
        run: cp .claude/config/audio-effects.cfg.sample .claude/config/audio-effects.cfg

      - name: Validate JS syntax
        run: npm run test:syntax

      - name: Run Node.js unit tests
        env:
          ELEVENLABS_API_KEY: test_mock_key
          # Note: AGENTVIBES_TEST_MODE is NOT set here intentionally.
          # Node.js unit tests use mock.module for isolation and must not have
          # AGENTVIBES_TEST_MODE set, otherwise IS_TEST stubs bypass real code paths.
        # Run directly (not via npm) so Git bash expands the glob
        # --test-force-exit prevents readline.emitKeypressEvents workers from hanging
        run: node --experimental-test-module-mocks --test-force-exit --test test/unit/*.test.js

      # Fix #12: Use npx c8 instead of ./node_modules/.bin/c8 (fragile on Windows)
      - name: Run Node.js coverage report
        env:
          ELEVENLABS_API_KEY: test_mock_key
        run: npx c8 --reporter=lcov --reporter=text node --experimental-test-module-mocks --test-force-exit --test test/unit/*.test.js

      # ─── BATS integration tests via Git bash ─────────────────────────────

      - name: Run BATS integration tests
        env:
          ELEVENLABS_API_KEY: test_mock_key
          AGENTVIBES_TEST_MODE: "true"
        run: |
          echo "sox: $(sox --version 2>&1 | head -1 || echo 'not found')"
          echo "ffmpeg: $(ffmpeg -version 2>&1 | head -1 || echo 'not found')"

          set +e
          BATS_OUTPUT=$(AGENTVIBES_TEST_MODE=true bats test/unit/*.bats 2>&1)
          BATS_EXIT=$?
          set -e

          echo "$BATS_OUTPUT"

          if [ "$BATS_EXIT" -eq 0 ]; then
            echo "✅ All BATS tests passed"
            exit 0
          fi

          # BATS exited non-zero — check for real failures vs plan-mismatch from skips
          FAIL_COUNT=$(echo "$BATS_OUTPUT" | grep -c '^not ok' || echo 0)
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "❌ $FAIL_COUNT BATS test(s) failed"
            exit 1
          fi

          # No 'not ok' lines — check if it's the expected plan-mismatch from skipped tests
          # (newer BATS doesn't count skipped tests toward "Executed", causing exit 1)
          if echo "$BATS_OUTPUT" | grep -q 'instead of expected'; then
            echo "ℹ️  BATS plan mismatch due to skipped tests — treating as pass"
            exit 0
          fi

          echo "❌ BATS exited with code $BATS_EXIT (unknown reason)"
          exit "$BATS_EXIT"

      # ─── PowerShell syntax validation ────────────────────────────────────

      - name: Validate PowerShell hooks syntax
        shell: powershell
        run: |
          $failed = $false
          $searchPaths = @(
            '.claude\hooks-windows',
            'scripts',
            '.'
          )
          $scripts = $searchPaths | ForEach-Object {
            Get-ChildItem -Path $_ -Filter '*.ps1' -ErrorAction SilentlyContinue
          }

          Write-Host "Checking $($scripts.Count) PowerShell script(s)..."
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              Write-Host "❌ $($script.Name)"
              $parseErrors | ForEach-Object { Write-Host "   Line $($_.Extent.StartLineNumber): $_" }
              $failed = $true
            } else {
              Write-Host "✅ $($script.Name)"
            }
          }

          if ($failed) {
            Write-Error "One or more PowerShell scripts have syntax errors."
            exit 1
          }

      # ─── Windows SAPI TTS smoke test ─────────────────────────────────────

      # Fix #5: SpMemoryStream.GetData() returns raw PCM (no WAV header). Raise threshold accordingly.
      - name: Windows SAPI TTS smoke test
        shell: powershell
        run: |
          $sapi = New-Object -ComObject SAPI.SpVoice
          $stream = New-Object -ComObject SAPI.SpMemoryStream
          $sapi.AudioOutputStream = $stream
          $sapi.Speak("AgentVibes Windows test", 0)
          $data = $stream.GetData()

          # SpMemoryStream returns raw PCM samples (no WAV header).
          # A single spoken word at SAPI default rate (22kHz/16-bit) produces ~10,000+ bytes.
          if ($data.Length -gt 1000) {
            Write-Host "✅ SAPI synthesized $($data.Length) bytes of raw PCM audio"
          } else {
            Write-Error "SAPI produced insufficient audio ($($data.Length) bytes - expected >1000)"
            exit 1
          }

      - name: List available Windows SAPI voices
        shell: powershell
        run: |
          $sapi = New-Object -ComObject SAPI.SpVoice
          $voices = $sapi.GetVoices()
          Write-Host "Found $($voices.Count) Windows SAPI voice(s):"
          for ($i = 0; $i -lt $voices.Count; $i++) {
            Write-Host "  [$i] $($voices.Item($i).GetDescription())"
          }

      - name: Test play-tts-sapi.ps1 can synthesize to file
        shell: powershell
        env:
          AGENTVIBES_TEST_MODE: "true"
        run: |
          $outFile = "$env:TEMP\agentvibes-ci-test.wav"
          $sapi = New-Object -ComObject SAPI.SpVoice
          $stream = New-Object -ComObject SAPI.SpFileStream
          # SpeechStreamFileMode enum value 3 = SSFMCreateForWrite (create file for writing)
          # Using numeric literal because SpeechLib interop type is not always registered
          $stream.Open($outFile, 3, $false)
          $sapi.AudioOutputStream = $stream
          $sapi.Speak("CI test", 0)
          $stream.Close()

          if ((Test-Path $outFile) -and (Get-Item $outFile).Length -gt 44) {
            Write-Host "✅ play-tts-sapi produced $('{0:N0}' -f (Get-Item $outFile).Length) bytes"
            Remove-Item $outFile -Force
          } else {
            Write-Error "❌ SAPI file output failed or empty"
            exit 1
          }

      # ─── Windows hooks integration ────────────────────────────────────────

      # Fix #9: Assert voice-manager output is non-empty (not just "completed")
      - name: Test voice-manager-windows.ps1 list operation
        shell: powershell
        run: |
          $script = ".claude\hooks-windows\voice-manager-windows.ps1"
          if (-not (Test-Path $script)) {
            Write-Error "voice-manager-windows.ps1 not found"
            exit 1
          }
          $result = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File (Resolve-Path $script).Path list 2>&1
          Write-Host "Output: $result"
          $resultStr = $result | Out-String
          if ([string]::IsNullOrWhiteSpace($resultStr)) {
            Write-Error "voice-manager-windows.ps1 list returned empty output"
            exit 1
          }
          Write-Host "✅ voice-manager-windows.ps1 list returned $($resultStr.Trim().Split("`n").Count) line(s)"

      - name: Test effects-manager.ps1 get-reverb
        shell: powershell
        env:
          AGENTVIBES_TEST_MODE: "true"
        run: |
          $script = ".claude\hooks-windows\effects-manager.ps1"
          if (-not (Test-Path $script)) {
            Write-Host "⚠️  effects-manager.ps1 not found — skipping"
            exit 0
          }
          $result = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File (Resolve-Path $script).Path get-reverb 2>&1
          Write-Host "Output: $result"
          Write-Host "✅ effects-manager.ps1 get-reverb completed (exit: $LASTEXITCODE)"

      - name: Test provider-manager.ps1 get
        shell: powershell
        env:
          AGENTVIBES_TEST_MODE: "true"
        run: |
          $script = ".claude\hooks-windows\provider-manager.ps1"
          if (-not (Test-Path $script)) {
            Write-Host "⚠️  provider-manager.ps1 not found — skipping"
            exit 0
          }
          $result = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File (Resolve-Path $script).Path get 2>&1
          Write-Host "Output: $result"
          Write-Host "✅ provider-manager.ps1 get completed (exit: $LASTEXITCODE)"

      # ─── play-tts.ps1 CLAUDE_PROJECT_DIR regression test ────────────────────
      # Regression guard for: play-tts.ps1 must read audio-effects.cfg and
      # background-music-enabled.txt from CLAUDE_PROJECT_DIR first, so that
      # global/npm-link installs (where the package dir ≠ project dir) still
      # pick up per-LLM config written by the TUI preview to the project dir.

      - name: play-tts.ps1 reads LLM config from CLAUDE_PROJECT_DIR
        shell: powershell
        env:
          AGENTVIBES_TEST_MODE: "true"
          AGENTVIBES_VERBOSE: "1"
        run: |
          # Create an isolated project dir with its own audio-effects.cfg
          $proj = Join-Path $env:TEMP "agentvibes-ci-proj-$([System.IO.Path]::GetRandomFileName())"
          $cfgDir = Join-Path $proj ".claude\config"
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null

          # Write a sentinel LLM row — voice field has a unique value we can grep for
          # Engine "piper" tests the cross-platform alias (TUI writes "piper", not "windows-piper")
          Set-Content "$cfgDir\audio-effects.cfg" "llm:ci-test|off||0.20|ci-sentinel-voice||piper"
          Set-Content "$cfgDir\background-music-enabled.txt" "false"

          $env:CLAUDE_PROJECT_DIR = $proj

          $out = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File (Resolve-Path ".claude\hooks-windows\play-tts.ps1").Path `
            "CI regression test" "" -llm "ci-test" 2>&1 | Out-String

          Remove-Item $proj -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Output: $out"

          # The sentinel voice must appear in verbose debug output
          if ($out -notmatch "ci-sentinel-voice") {
            Write-Error "FAIL: play-tts.ps1 did not read audio-effects.cfg from CLAUDE_PROJECT_DIR — LLM config lookup broken"
            exit 1
          }
          Write-Host "✅ play-tts.ps1 correctly read LLM config from CLAUDE_PROJECT_DIR"

      - name: play-tts.ps1 reads bg-music-enabled from CLAUDE_PROJECT_DIR
        shell: powershell
        env:
          AGENTVIBES_TEST_MODE: "true"
          AGENTVIBES_VERBOSE: "1"
        run: |
          $proj = Join-Path $env:TEMP "agentvibes-ci-proj-$([System.IO.Path]::GetRandomFileName())"
          $cfgDir = Join-Path $proj ".claude\config"
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null

          # LLM row with no bg track — enabled flag must come from CLAUDE_PROJECT_DIR
          Set-Content "$cfgDir\audio-effects.cfg" "llm:ci-bgtest|off|||ci-bg-voice||piper"
          Set-Content "$cfgDir\background-music-enabled.txt" "true"

          $env:CLAUDE_PROJECT_DIR = $proj

          $out = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File (Resolve-Path ".claude\hooks-windows\play-tts.ps1").Path `
            "CI bg test" "" -llm "ci-bgtest" 2>&1 | Out-String

          Remove-Item $proj -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Output: $out"

          # BgEnabled should be True in verbose output
          if ($out -notmatch "BgEnabled=True") {
            Write-Error "FAIL: play-tts.ps1 did not read background-music-enabled.txt from CLAUDE_PROJECT_DIR"
            exit 1
          }
          Write-Host "✅ play-tts.ps1 correctly read BgEnabled=true from CLAUDE_PROJECT_DIR"

      # ─── AGENTVIBES_LLM_KEY fallback regression test ────────────────────────
      # Regression guard: when Claude Code fires hooks it sets AGENTVIBES_LLM_KEY
      # but does NOT pass -llm to play-tts.ps1.  The script must fall back to
      # AGENTVIBES_LLM_KEY so the user's configured voice/reverb/music is used
      # instead of the global default.

      - name: play-tts.ps1 uses AGENTVIBES_LLM_KEY when -llm flag is absent
        shell: powershell
        env:
          AGENTVIBES_TEST_MODE: "true"
          AGENTVIBES_VERBOSE: "1"
        run: |
          # Create a project dir with a known LLM config row
          $proj = Join-Path $env:TEMP "agentvibes-ci-llmkey-$([System.IO.Path]::GetRandomFileName())"
          $cfgDir = Join-Path $proj ".claude\config"
          New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null

          # Sentinel voice — unique string we can grep for in verbose output
          Set-Content "$cfgDir\audio-effects.cfg" "llm:claude-code|off|||llmkey-sentinel-voice||piper"

          $env:CLAUDE_PROJECT_DIR  = $proj
          $env:AGENTVIBES_LLM_KEY  = "llm:claude-code"   # set by Claude Code hooks; no -llm flag passed

          # Call play-tts.ps1 WITHOUT the -llm parameter (exactly how Claude Code hooks invoke it)
          $out = & powershell -NoProfile -ExecutionPolicy Bypass `
            -File (Resolve-Path ".claude\hooks-windows\play-tts.ps1").Path `
            "CI hook test" 2>&1 | Out-String

          Remove-Item $proj -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Output: $out"

          if ($out -notmatch "llmkey-sentinel-voice") {
            Write-Error "FAIL: play-tts.ps1 did not resolve LLM identity from AGENTVIBES_LLM_KEY — configured voice will not play when hooks fire"
            exit 1
          }
          Write-Host "✅ play-tts.ps1 correctly resolved LLM config from AGENTVIBES_LLM_KEY (no -llm flag)"

      # ─── Installer smoke test ─────────────────────────────────────────────

      # Fix #10: Removed || true — real errors must not be silenced
      - name: Installer smoke test (--help)
        run: node src/installer.js --help

      - name: MCP server syntax check
        run: node -c mcp-server/install-deps.js

      # ─── Summary ──────────────────────────────────────────────────────────

      - name: Report test results
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════╗"
          echo "║         Windows Test Suite - Summary               ║"
          echo "╚════════════════════════════════════════════════════╝"
          echo "  OS: windows-latest"
          echo "  Node: $(node --version)"
          echo "  npm: $(npm --version)"
          echo ""

      # Fix #4: Use runner.temp (native Windows path) instead of /tmp for artifact collection
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs-node-${{ matrix.node-version }}
          path: |
            coverage/
            ${{ runner.temp }}/agentvibes-*.log
          retention-days: 7
